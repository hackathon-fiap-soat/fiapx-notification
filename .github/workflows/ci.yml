name: CI · lint, testes, pacote da Lambda e Terraform do notification

# Checks de todo PR: lint, testes (unitários, contrato e integração com o LocalStack e o Mailpit do
# fiapx-infra/local, cobertura ≥ 80%), build do pacote e validação do Terraform.
# O deploy está em deploy.yml (ADR-018, credenciais da AWS Academy, ADR-019). O SonarCloud roda depois dos testes, com a cobertura do Jest (Etapa 8).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Lint, testes e pacote da Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fiapx-notification
    steps:
      # Os três repositórios lado a lado, como na máquina de quem desenvolve.
      - name: Baixar o fiapx-notification
        uses: actions/checkout@v4
        with:
          path: fiapx-notification
          # Histórico completo: o SonarCloud usa o blame para separar código novo do antigo.
          fetch-depth: 0
      - name: Baixar o fiapx-docs (contratos)
        uses: actions/checkout@v4
        with:
          repository: hackathon-fiap-soat/fiapx-docs
          path: fiapx-docs
      - name: Baixar o fiapx-infra (ambiente local)
        uses: actions/checkout@v4
        with:
          repository: hackathon-fiap-soat/fiapx-infra
          path: fiapx-infra
      - name: Instalar o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: fiapx-notification/.nvmrc
          cache: npm
          cache-dependency-path: fiapx-notification/package-lock.json
      - name: Instalar as dependências (npm ci)
        run: npm ci
      - name: Rodar o lint
        run: npm run lint
      - name: Subir o ambiente local (MySQL, LocalStack e Mailpit)
        working-directory: fiapx-infra/local
        run: docker compose up -d --wait
      - name: Rodar os testes com cobertura (unitários, contrato e integração)
        run: npm run test:coverage
      - name: Analisar no SonarCloud e esperar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        with:
          projectBaseDir: fiapx-notification
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Mostrar os logs do ambiente local (só em falha)
        if: failure()
        working-directory: fiapx-infra/local
        run: docker compose logs --no-color
      - name: Gerar o pacote da Lambda (zip)
        run: npm run build
      - name: Publicar o zip como artefato do run
        uses: actions/upload-artifact@v4
        with:
          name: fiapx-notification-zip
          path: fiapx-notification/dist/fiapx-notification.zip
          retention-days: 7

  terraform:
    name: Terraform (fmt e validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Conferir a formatação (terraform fmt)
        run: terraform fmt -check -recursive
      - name: Inicializar sem backend (terraform init)
        run: terraform init -backend=false -input=false
      - name: Validar a configuração (terraform validate)
        run: terraform validate
