name: Deploy · Lambda de notificação, fila, tabela e segredo SMTP

# Deploy deste serviço (ADR-018): no merge na main e chamado pelo deploy-all do fiapx-infra.
# Credenciais da AWS Academy em Secrets (ADR-019). Com o ambiente destruído, falha ao ler o SSM.
# As credenciais SMTP vêm dos Secrets SMTP_USER, SMTP_PASSWORD e SMTP_FROM (spec §8.6.4). Chamado pelo
# deploy-all (secrets: inherit), os Secrets lidos são os do fiapx-infra ou da organização.
on:
  push:
    branches: [main]
    # Mudança só de documentação ou de contexto do Claude não reimplanta o serviço.
    paths-ignore: ["**.md", ".claude/**", "docs/**", "LICENSE"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fiapx-notification
  cancel-in-progress: false

jobs:
  # Chamado pelo deploy-all, aparece como "2 · Notificação (Lambda, fila e tabela) / Implantar".
  deploy:
    name: Implantar
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - name: Baixar o fiapx-notification
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-notification }
      - name: Instalar o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Gerar o pacote da Lambda (zip)
        run: npm run build
      - name: Autenticar na AWS Academy e garantir o bucket do state
        id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Conferir se o ambiente prod está no ar (parâmetros do SSM)
        run: |
          for p in sns/alerts_topic_arn vpc/private_subnet_ids vpc/lambda_security_group_id sqs/saga-replies/url web/url; do
            aws ssm get-parameter --name "/fiapx/prod/$p" >/dev/null 2>&1 || {
              echo "::error::Falta /fiapx/prod/$p. Ambiente prod fora do ar: rode o deploy-all no fiapx-infra."
              exit 1
            }
          done
      - name: Avisar se faltam os Secrets SMTP
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          for s in SMTP_USER SMTP_PASSWORD SMTP_FROM; do
            [ -n "${!s}" ] || echo "::warning::Secret $s vazio: o deploy segue, mas os e-mails vão falhar até ele ser configurado."
          done
      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Aplicar a fila, a tabela, o segredo SMTP e a Lambda (Terraform)
        working-directory: infra
        env:
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          TF_VAR_smtp_from: ${{ secrets.SMTP_FROM }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform apply -auto-approve -input=false -lock-timeout=10m
      - name: Aguardar a Lambda e conferir o gatilho da fila (event source mapping)
        run: |
          set -euo pipefail
          nome=$(terraform -chdir=infra output -raw lambda_name)
          aws lambda wait function-updated-v2 --function-name "$nome"
          estado=$(aws lambda list-event-source-mappings --function-name "$nome" --query 'EventSourceMappings[0].State' --output text)
          echo "Event source mapping: $estado"
          case "$estado" in Enabled|Enabling|Updating|Creating) ;; *) echo "::error::Event source mapping em estado $estado"; exit 1 ;; esac
      - name: Escrever o resumo do deploy
        run: |
          {
            echo "### fiapx-notification implantado"
            echo "- Lambda: $(terraform -chdir=infra output -raw lambda_name)"
            echo "- Fila: $(terraform -chdir=infra output -raw queue_url)"
            echo "- Tabela: $(terraform -chdir=infra output -raw table_name)"
          } >> "$GITHUB_STEP_SUMMARY"
