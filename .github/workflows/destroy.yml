name: destroy

# Chamado pelo destroy-all do fiapx-infra (ADR-018), antes de a infraestrutura ser destruída.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-notification }
      - id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - run: terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
      # Sem a infraestrutura (SSM do tópico de alarmes), o state pode estar vazio; nada a destruir.
      - run: terraform destroy -auto-approve -input=false -lock-timeout=10m
