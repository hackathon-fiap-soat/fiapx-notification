name: Destroy · Lambda de notificação, fila e tabela

# Chamado pelo destroy-all do fiapx-infra (ADR-018), antes de a infraestrutura ser destruída.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Chamado pelo destroy-all, aparece como "4 · Notificação (Lambda, fila e tabela) / Remover".
  destroy:
    name: Remover
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - name: Baixar o fiapx-notification
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-notification }
      - name: Autenticar na AWS Academy e garantir o bucket do state
        id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      # O destroy não lê o pacote, mas a variável lambda_zip precisa apontar para um arquivo.
      - name: Criar um zip vazio (o Terraform exige o arquivo)
        run: mkdir -p dist && touch dist/fiapx-notification.zip
      # Sem a infraestrutura (SSM do tópico de alarmes), o state pode estar vazio; nada a destruir.
      - name: Destruir a Lambda, a fila, a tabela e o segredo SMTP (Terraform)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform destroy -auto-approve -input=false -lock-timeout=10m
